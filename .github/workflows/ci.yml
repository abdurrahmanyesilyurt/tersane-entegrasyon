name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  test:
    name: Build and test (SQL Server in Testcontainers, Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Tersane.slnx
      - name: Build (warnings are errors)
        run: dotnet build Tersane.slnx --no-restore -c Release
      - name: Install Chromium for the RPA end-to-end test
        run: dotnet run --project src/Tersane.Rpa -c Release --no-build -- --tarayici-kur
      - name: Tests (xUnit v3 + Testcontainers SQL Server 2022)
        run: dotnet test Tersane.slnx --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults

  panel:
    name: React panel (type-check and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/tersane-panel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/tersane-panel/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  compose:
    name: docker compose end to end
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Smoke test (web form → SQL Server → worker → mock ERP)
        run: ./scripts/smoke.sh http://localhost:5100
      - name: RPA bot against the legacy form
        run: |
          docker compose --profile rpa run --rm rpa
          ls -R rpa-out | head -50
          test -f rpa-out/*/sonuc.xlsx
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rpa-out
          path: rpa-out
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop
        if: always()
        run: docker compose --profile rpa down -v

  oracle:
    name: PL/SQL package on Oracle Database Free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start Oracle Free (schema, package and tests run on first start)
        run: docker compose --profile oracle up -d oracle
      - name: Wait for the init scripts and check the result
        run: |
          for i in $(seq 1 60); do
            logs=$(docker compose logs oracle --no-color)
            if echo "$logs" | grep -q "ALL ORACLE CHECKS PASSED"; then echo "$logs" | grep -E "^oracle-1  \| (ok|→|ALL)" || true; exit 0; fi
            # Only real error lines ("ORA-06512: …" at the start of a log line), not test names that mention ORA-20404.
            if echo "$logs" | grep -qE "TEST FAILED|\| (ORA|SP2)-[0-9]+:"; then echo "$logs" | tail -80; exit 1; fi
            sleep 5
          done
          docker compose logs oracle --no-color | tail -80
          exit 1
      - name: Stop
        if: always()
        run: docker compose --profile oracle down -v
